[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyreceipt"
version = "0.1.0"
description = "Lightweight receipt processing and OCR application designed for low-resource environments (e.g., Raspberry Pi)."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Emanuele Galiano" }
]
keywords = ["receipt", "ocr", "tesseract", "paddleocr", "rapidocr", "easyocr", "raspberry-pi", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.21.0",
    "opencv-python-headless>=4.5.0",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
easyocr = [
    "easyocr>=1.7.0",
    "torch>=2.0.0",
    "torchvision",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
pyreceipt-demo = "demo_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyreceipt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
